<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: Georgia, serif; background: #ffffff; display: flex; justify-content: center; padding: 30px; }
    .panel { background: #f1f5f9; padding: 25px; border-radius: 12px; max-width: 420px; width: 100%; }
    button { background: #dc2626; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>

<div class="panel">
  <h1>Admin Dashboard</h1>
  <h3>Election Results</h3>
  <p>Total Votes: <span id="total">0</span></p>
  <p>Candidate A: <span id="adminA">0</span> votes</p>
  <p>Candidate B: <span id="adminB">0</span> votes</p>
  <p>Candidate C: <span id="adminC">0</span> votes</p>
  <button onclick="resetVotes()">Reset Election</button>
</div>

<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { getDatabase, ref, onValue, set } from "https://gstatic.com";

  // PASTE THE SAME FIREBASE CONFIG HERE
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_://firebaseapp.com",
    databaseURL: "https://YOUR_://firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_://appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const votesRef = ref(db, 'votes');

  onValue(votesRef, (snapshot) => {
    const data = snapshot.val() || { A: 0, B: 0, C: 0 };
    const a = data.A || 0;
    const b = data.B || 0;
    const c = data.C || 0;

    document.getElementById('adminA').innerText = a;
    document.getElementById('adminB').innerText = b;
    document.getElementById('adminC').innerText = c;
    document.getElementById('total').innerText = a + b + c;
  });

  window.resetVotes = function() {
    const pass = prompt("Enter Admin Password to reset:");
    if (pass === "admin123") {
      set(votesRef, { A: 0, B: 0, C: 0 });
      alert("All votes have been reset to 0.");
    } else {
      alert("Incorrect password.");
    }
  };
</script>

</body>
</html>
