<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CivicPulse — Online Voting System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #f7f8fc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f3f9;
      --ink-primary: #0f172a;
      --ink-secondary: #475569;
      --ink-muted: #64748b;
      --accent: #4338ca;
      --accent-hover: #3730a3;
      --accent-soft: #eef2ff;
      --accent-border: #c7d2fe;
      --gold: #d97706;
      --gold-soft: #fffbeb;
      --gold-border: #fde68a;
      --success: #059669;
      --success-soft: #ecfdf5;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 4px 10px -6px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 20px 40px -12px rgba(15, 23, 42, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(at 10% 0%, rgba(67, 56, 202, 0.06) 0px, transparent 50%),
        radial-gradient(at 90% 10%, rgba(217, 119, 6, 0.05) 0px, transparent 45%);
      color: var(--ink-primary);
      line-height: 1.5;
      min-height: 100vh;
    }

    .font-display {
      font-family: "Fraunces", Georgia, serif;
    }

    .font-mono {
      font-family: "JetBrains Mono", monospace;
    }

    /* Top Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent) 0%, #6366f1 100%);
      display: grid;
      place-items: center;
      color: #fff;
      box-shadow: 0 4px 12px rgba(67, 56, 202, 0.25);
    }

    .brand-title {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: 19px;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
    }

    .nav-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-subtle);
      padding: 4px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
    }

    .nav-pill {
      border: none;
      background: transparent;
      color: var(--ink-secondary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-pill:hover {
      color: var(--ink-primary);
    }

    .nav-pill.active {
      background: var(--bg-surface);
      color: var(--accent);
      box-shadow: var(--shadow-sm);
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--bg-surface);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.18);
    }

    .status-chip.closed .status-dot {
      background: var(--danger);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.18);
    }

    /* Main Layout */
    .main-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }

    /* Hero Banner */
    .hero-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-md);
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 24px;
      align-items: center;
    }

    @media (max-width: 820px) {
      .hero-card {
        grid-template-columns: 1fr;
        padding: 22px;
      }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      padding: 5px 12px;
      border-radius: var(--radius-full);
      margin-bottom: 12px;
    }

    .hero-title {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .hero-desc {
      color: var(--ink-secondary);
      font-size: 15px;
      max-width: 540px;
    }

    .hero-stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat-tile {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: "Fraunces", Georgia, serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--ink-primary);
    }

    /* Cards & Forms */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    .card-title {
      font-family: "Fraunces", Georgia, serif;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--ink-secondary);
      margin-bottom: 18px;
    }

    .auth-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .auth-grid {
        grid-template-columns: 1fr;
      }
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-subtle);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: var(--bg-surface);
      color: var(--ink-primary);
      box-shadow: var(--shadow-sm);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-primary);
      margin-bottom: 6px;
    }

    .input,
    .select {
      width: 100%;
      padding: 11px 13px;
      font-family: inherit;
      font-size: 14px;
      color: var(--ink-primary);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input:focus,
    .select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.12);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(67, 56, 202, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--bg-subtle);
      color: var(--ink-primary);
      border-color: var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #e6eaf3;
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink-secondary);
      padding: 6px 10px;
      font-size: 12px;
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: #fecaca;
    }

    .btn-danger:hover:not(:disabled) {
      background: #fee2e2;
    }

    .btn-full {
      width: 100%;
    }

    /* Demo Credentials Box */
    .demo-box {
      background: var(--gold-soft);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
    }

    .demo-box-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gold);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .demo-cred-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-top: 8px;
    }

    .demo-cred-text {
      font-size: 12px;
      color: var(--ink-secondary);
    }

    .demo-cred-text strong {
      color: var(--ink-primary);
    }

    /* Ballot Section */
    .voter-banner {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .voter-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .voter-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      display: grid;
      place-items: center;
      font-size: 15px;
      border: 1px solid var(--accent-border);
    }

    .position-block {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .position-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .position-title {
      font-family: "Fraunces", Georgia, serif;
      font-size: 20px;
      font-weight: 700;
    }

    .position-note {
      font-size: 12px;
      color: var(--ink-muted);
      font-weight: 500;
    }

    .candidates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
      gap: 14px;
    }

    .candidate-card {
      position: relative;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      background: var(--bg-surface);
      cursor: pointer;
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .candidate-card:hover {
      border-color: #a5b4fc;
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .candidate-card.selected {
      border-color: var(--accent);
      background: linear-gradient(180deg, #ffffff 0%, var(--accent-soft) 100%);
      box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.12);
    }

    .candidate-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .candidate-avatar {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .candidate-name {
      font-weight: 700;
      font-size: 15px;
      color: var(--ink-primary);
    }

    .candidate-slogan {
      font-size: 12px;
      color: var(--ink-secondary);
      font-style: italic;
    }

    .check-indicator {
      margin-left: auto;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .candidate-card.selected .check-indicator {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .candidate-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .pill-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-secondary);
      background: var(--bg-subtle);
      padding: 3px 8px;
      border-radius: var(--radius-full);
    }

    /* Sticky Ballot Footer */
    .ballot-submit-bar {
      position: sticky;
      bottom: 16px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 22px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    /* Receipt Banner */
    .receipt-banner {
      background: var(--success-soft);
      border: 1px solid #a7f3d0;
      border-radius: var(--radius-lg);
      padding: 22px;
      margin-bottom: 22px;
    }

    .hash-box {
      background: var(--bg-surface);
      border: 1px solid #a7f3d0;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 12px;
      word-break: break-all;
      color: var(--ink-primary);
      margin: 10px 0 14px;
    }

    /* Live Results */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 20px;
      margin-top: 18px;
    }

    .tally-row {
      margin-bottom: 16px;
    }

    .tally-row:last-child {
      margin-bottom: 0;
    }

    .tally-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .leader-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      background: var(--gold-soft);
      color: var(--gold);
      border: 1px solid var(--gold-border);
      padding: 2px 8px;
      border-radius: var(--radius-full);
    }

    .progress-track {
      height: 10px;
      width: 100%;
      background: var(--bg-subtle);
      border-radius: var(--radius-full);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent) 0%, #6366f1 100%);
      border-radius: var(--radius-full);
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .progress-fill.leader {
      background: linear-gradient(90deg, var(--gold) 0%, #f59e0b 100%);
    }

    /* Admin Section */
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 18px;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
      background: var(--bg-subtle);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-dialog {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      max-width: 500px;
      width: 100%;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      animation: popIn 0.18s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 360px;
    }

    .toast {
      background: var(--ink-primary);
      color: #fff;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.2s ease-out;
    }

    .toast.success {
      background: #065f46;
    }

    .toast.error {
      background: #991b1b;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden {
      display: none !important;
    }

    .summary-list {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin: 12px 0;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .summary-item:last-child {
      border-bottom: none;
    }
  </style>
</head>

    <div class="topbar-inner">
      <a href="#top" class="brand" onclick="switchView('ballot'); return false;">

          <svg width="22" height="22" viewBox="
