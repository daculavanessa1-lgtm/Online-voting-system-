<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Voting System</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --danger: #b91c1c;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
    }

    h1 {
      font-size: 24px;
      color: var(--primary);
      text-align: center;
      margin-bottom: 6px;
    }

    .sub {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 17px;
      margin-bottom: 12px;
    }

    .field {
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--ink);
      margin-top: 8px;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
      margin-top: 8px;
    }

    hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 20px 0;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      background: #f8fafc;
    }

    .option input {
      width: auto;
    }

    .results {
      margin-top: 20px;
      padding: 16px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
    }

    .bar-wrap {
      height: 8px;
      background: #dcfce7;
      border-radius: 999px;
      overflow: hidden;
      margin: 6px 0 12px;
    }

    .bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .hidden {
      display: none;
    }

    .footer-link {
      margin-top: 16px;
      text-align: center;
    }

    .footer-link button {
      width: auto;
      background: none;
      color: var(--primary);
      text-decoration: underline;
      font-size: 13px;
      padding: 4px 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Online Voting System</h1>
    <p class="sub">Register, sign in, and cast one vote per user</p>

    <!-- Auth Section -->
    <div id="authSection">
      <h2>Voter Registration</h2>
      <div class="field">
        <input type="text" id="regName" placeholder="Full Name" />
      </div>
      <div class="field">
        <input type="password" id="regPin" placeholder="Voter PIN" />
      </div>
      <button class="btn-primary" onclick="registerVoter()">Register</button>

      <hr />

      <h2>Voter Login</h2>
      <div class="field">
        <input type="text" id="loginName" placeholder="Full Name" />
      </div>
      <div class="field">
        <input type="password" id="loginPin" placeholder="Voter PIN" />
      </div>
      <button class="btn-secondary" onclick="loginVoter()">Login</button>
    </div>

    <!-- Voting Section -->
    <div id="voteSection" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px;">
        <h2 id="welcomeLabel" style="margin:0;">Welcome</h2>
        <button class="btn-secondary" style="width:auto; margin:0; padding:8px 14px;" onclick="logoutVoter()">Logout</button>
      </div>

      <h2>Choose Your Candidate</h2>
      <label class="option"><input type="radio" name="cand" value="A" /> Candidate A</label>
      <label class="option"><input type="radio" name="cand" value="B" /> Candidate B</label>
      <label class="option"><input type="radio" name="cand" value="C" /> Candidate C</label>

      <button class="btn-primary" onclick="submitVote()">Submit Vote</button>

      <div class="results">
        <h2>Live Results</h2>
        <div>Candidate A: <strong id="cA">0</strong></div>
        <div class="bar-wrap"><div class="bar" id="bA"></div></div>

        <div>Candidate B: <strong id="cB">0</strong></div>
        <div class="bar-wrap"><div class="bar" id="bB"></div></div>

        <div>Candidate C: <strong id="cC">0</strong></div>
        <div class="bar-wrap"><div class="bar" id="bC"></div></div>
      </div>
    </div>

    <!-- Admin Section -->
    <div id="adminSection" class="hidden">
      <h2>Admin Dashboard</h2>
      <p style="margin-bottom:10px;">Total Votes: <strong id="adminTotal">0</strong></p>
      <p>Candidate A: <strong id="adminA">0</strong></p>
      <p>Candidate B: <strong id="adminB">0</strong></p>
      <p>Candidate C: <strong id="adminC">0</strong></p>
      <button class="btn-danger" onclick="resetData()">Reset All Votes & Voters</button>
      <button class="btn-secondary" onclick="closeAdmin()">Back</button>
    </div>

    <div class="footer-link">
      <button onclick="openAdmin()">Admin Dashboard</button>
    </div>
  </div>

  <script>
    const KEY_USERS = "ovs_users_v1";
    const KEY_VOTES = "ovs_votes_v1";
    const KEY_USER = "ovs_current_v1";

    const getUsers = () => JSON.parse(localStorage.getItem(KEY_USERS) || "[]");
    const setUsers = (u) => localStorage.setItem(KEY_USERS, JSON.stringify(u));
    const getVotes = () => JSON.parse(localStorage.getItem(KEY_VOTES) || '{"A":0,"B":0,"C":0}');
    const setVotes = (v) => localStorage.setItem(KEY_VOTES, JSON.stringify(v));
    const getCurrent = () => JSON.parse(localStorage.getItem(KEY_USER) || "null");
    const setCurrent = (u) => u ? localStorage.setItem(KEY_USER, JSON.stringify(u)) : localStorage.removeItem(KEY_USER);

    function registerVoter() {
      const name = document.getElementById("regName").value.trim();
      const pin = document.getElementById("regPin").value.trim();
      if (!name || !pin) return alert("Enter both name and PIN.");

      const users = getUsers();
      if (users.some(u => u.name.toLowerCase() === name.toLowerCase())) {
        return alert("Voter already registered. Please login.");
      }

      users.push({ name, pin, voted: false });
      setUsers(users);
      document.getElementById("regName").value = "";
      document.getElementById("regPin").value = "";
      alert("Registration successful! Please login.");
    }

    function loginVoter() {
      const name = document.getElementById("loginName").value.trim();
      const pin = document.getElementById("loginPin").value.trim();
      const user = getUsers().find(u => u.name.toLowerCase() === name.toLowerCase() && u.pin === pin);
      if (!user) return alert("Invalid name or PIN.");

      setCurrent(user);
      document.getElementById("loginName").value = "";
      document.getElementById("loginPin").value = "";
      showVote();
    }

    function logoutVoter() {
      setCurrent(null);
      showAuth();
    }

    function submitVote() {
      const current = getCurrent();
      if (!current) return showAuth();

      const users = getUsers();
      const idx = users.findIndex(u => u.name.toLowerCase() === current.name.toLowerCase());
      if (idx !== -1 && users[idx].voted) {
        return alert("You have already voted!");
      }

      const chosen = document.querySelector('input[name="cand"]:checked');
      if (!chosen) return alert("Please select a candidate.");

      const votes = getVotes();
      votes[chosen.value] += 1;
      setVotes(votes);

      if (idx !== -1) {
        users[idx].voted = true;
        setUsers(users);
        setCurrent(users[idx]);
      }

      renderResults();
      alert("Vote submitted!");
    }

    function renderResults() {
      const v = getVotes();
      const total = v.A + v.B + v.C;

      document.getElementById("cA").textContent = v.A;
      document.getElementById("cB").textContent = v.B;
      document.getElementById("cC").textContent = v.C;

      document.getElementById("bA").style.width = total ? `${(v.A / total) * 100}%` : "0%";
      document.getElementById("bB").style.width = total ? `${(v.B / total) * 100}%` : "0%";
      document.getElementById("bC").style.width = total ? `${(v.C / total) * 100}%` : "0%";

      document.getElementById("adminTotal").textContent = total;
      document.getElementById("adminA").textContent = v.A;
      document.getElementById("adminB").textContent = v.B;
      document.getElementById("adminC").textContent = v.C;
    }

    function openAdmin() {
      const pass = prompt("Enter admin password (default: admin):");
      if (pass === "admin") {
        renderResults();
        document.getElementById("authSection").classList.add("hidden");
        document.getElementById("voteSection").classList.add("hidden");
        document.getElementById("adminSection").classList.remove("hidden");
      } else if (pass !== null) {
        alert("Wrong password.");
      }
    }

    function closeAdmin() {
      document.getElementById("adminSection").classList.add("hidden");
      getCurrent() ? showVote() : showAuth();
    }

    function resetData() {
      if (!confirm("Reset all votes and voters?")) return;
      localStorage.removeItem(KEY_USERS);
      localStorage.removeItem(KEY_VOTES);
      localStorage.removeItem(KEY_USER);
      renderResults();
      showAuth();
      alert("Election data reset.");
    }

    function showAuth() {
      document.getElementById("authSection").classList.remove("hidden");
      document.getElementById("voteSection").classList.add("hidden");
      document.getElementById("adminSection").classList.add("hidden");
    }

    function showVote() {
      const user = getCurrent();
      if (!user) return showAuth();
      document.getElementById("welcomeLabel").textContent = `Welcome, ${user.name}`;
      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("voteSection").classList.remove("hidden");
      document.getElementById("adminSection").classList.add("hidden");
      renderResults();
    }

    renderResults();
    if (getCurrent()) showVote();
  </script>
</body>
</html>
