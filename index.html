
<section id="admin-dashboard">
  <h2>Admin Dashboard</h2>

  <h3>Election Results</h3>
  <p>Total Votes: <span id="total-votes">0</span></p>

  <div id="admin-results">
    Loading results...
  </div>
</section>

<style>
#admin-dashboard {
  background: #f1f5f9;
  padding: 20px;
  margin: 20px;
  border-radius: 10px;
  color: #222;
}
</style>

<script>
function updateAdminDashboard() {
  const votes = JSON.parse(
    localStorage.getItem("votes") || "{}"
  );

  let total = 0;
  let results = "";

  for (const candidate in votes) {
    total += Number(votes[candidate]);

    results += `
      <p>${candidate}: ${votes[candidate]} votes</p>
    `;
  }

  document.getElementById("total-votes").textContent = total;

  document.getElementById("admin-results").innerHTML =
    results || "No votes recorded yet.";
}

updateAdminDashboard();
</script>
