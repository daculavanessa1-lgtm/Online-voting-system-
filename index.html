
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Voting System</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 450px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 12px #0002;
}
h1,h2 { text-align: center; color: #173b70; }
input,button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  box-sizing: border-box;
  border-radius: 6px;
}
input { border: 1px solid #bbb; }
button {
  border: none;
  background: #1769aa;
  color: white;
  font-weight: bold;
}
button:active { opacity: .8; }
.candidate {
  border: 1px solid #ddd;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
}
.hidden { display: none; }
.result { background: #e5f3ff; padding: 10px; margin: 8px 0; }
</style>
</head>
<body>

<div class="container" id="home">
<h1>Online Voting System</h1>
<h2>Voter Registration</h2>
<input id="regName" placeholder="Full Name">
<input id="regPass" type="password" placeholder="Create Password">
<button onclick="register()">Register</button>

<h2>Voter Login</h2>
<input id="loginName" placeholder="Full Name">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<hr>
<h2>Admin Login</h2>
<input id="adminCode" type="password" placeholder="Admin Code">
<button onclick="adminLogin()">Admin Login</button>
<p id="message"></p>
</div>

<div class="container hidden" id="voting">
<h1>Cast Your Vote</h1>
<p id="welcome"></p>

<div class="candidate">
<label><input type="radio" name="candidate" value="Candidate A"> Candidate A</label>
</div>
<div class="candidate">
<label><input type="radio" name="candidate" value="Candidate B"> Candidate B</label>
</div>
<div class="candidate">
<label><input type="radio" name="candidate" value="Candidate C"> Candidate C</label>
</div>

<button onclick="submitVote()">Submit Vote</button>
<button onclick="logout()">Logout</button>
<p id="voteMessage"></p>
</div>

<div class="container hidden" id="admin">
<h1>Admin Dashboard</h1>
<h2>Election Results</h2>
<div id="results"></div>
<button onclick="logout()">Logout</button>
</div>

<script>
const ADMIN_CODE = "ADMIN123";

let voters = JSON.parse(localStorage.getItem("voters") || "{}");
let votes = JSON.parse(localStorage.getItem("votes") || "{}");
let currentUser = "";

function saveData() {
  localStorage.setItem("voters", JSON.stringify(voters));
  localStorage.setItem("votes", JSON.stringify(votes));
}

function register() {
  let name = document.getElementById("regName").value.trim();
  let pass = document.getElementById("regPass").value;

  if (!name || !pass) {
    alert("Please complete all fields.");
    return;
  }

  let key = name.toLowerCase();

  if (voters[key]) {
    alert("Voter already registered.");
    return;
  }

  voters[key] = { name: name, password: pass };
  saveData();
  alert("Registration successful!");
}

function login() {
  let name = document.getElementById("loginName").value.trim();
  let pass = document.getElementById("loginPass").value;
  let key = name.toLowerCase();

  if (!voters[key] || voters[key].password !== pass) {
    alert("Invalid username or password.");
    return;
  }

  currentUser = key;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("voting").classList.remove("hidden");
  document.getElementById("welcome").textContent =
    "Welcome, " + voters[key].name;

  if (votes[key]) {
    document.getElementById("voteMessage").textContent =
      "You have already voted.";
  } else {
    document.getElementById("voteMessage").textContent = "";
  }
}

function submitVote() {
  if (votes[currentUser]) {
    alert("You have already voted!");
    return;
  }

  let selected = document.querySelector(
    'input[name="candidate"]:checked'
  );

  if (!selected) {
    alert("Please select a candidate.");
    return;
  }

  votes[currentUser] = selected.value;
  saveData();

  document.getElementById("voteMessage").textContent =
    "Your vote has been submitted successfully!";
  alert("Thank you for voting!");
}

function adminLogin() {
  let code = document.getElementById("adminCode").value;

  if (code !== ADMIN_CODE) {
    alert("Incorrect admin code!");
    return;
  }

  document.getElementById("home").classList.add("hidden");
  document.getElementById("admin").classList.remove("hidden");
  showResults();
}

function showResults() {
  let counts = {
    "Candidate A": 0,
    "Candidate B": 0,
    "Candidate C": 0
  };

  Object.values(votes).forEach(candidate => {
    if (counts[candidate] !== undefined) {
      counts[candidate]++;
    }
  });

  let total = Object.keys(votes).length;
  let html = "<div class='result'>Total registered voters: " +
    Object.keys(voters).length + "</div>";
  html += "<div class='result'>Total votes: " + total + "</div>";

  Object.keys(counts).forEach(candidate => {
    let percent = total ? (counts[candidate] / total * 100).toFixed(1) : 0;
    html += "<div class='result'><b>" + candidate +
      "</b><br>Votes: " + counts[candidate] +
      "<br>Percentage: " + percent + "%</div>";
  });

  document.getElementById("results").innerHTML = html;
}

function logout() {
  currentUser = "";
  document.querySelectorAll(".container").forEach(el =>
    el.classList.add("hidden")
  );
  document.getElementById("home").classList.remove("hidden");
}
</script>
</body>
</html>
