
<!DOCTYPE html>
<html>
<head>
    <title>Online Voting System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2f8;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            color: #154360;
        }

        input, select {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            width: 95%;
            padding: 12px;
            margin: 8px 0;
            background: #21618c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        button:hover {
            background: #154360;
        }

        .section {
            margin-top: 25px;
            padding: 15px;
            background: #f4f6f7;
            border-radius: 8px;
        }

        #message {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ONLINE VOTING SYSTEM</h1>
    <p>Welcome to the Online Voting System</p>

    <div class="section">
        <h2>Voter Section</h2>

        <input type="text" id="voterName"
        placeholder="Enter Voter Name">

        <select id="candidate">
            <option value="">Select Candidate</option>
            <option value="Nominee A">Candidate A</option>
            <option value="Nominee B">Candidate B</option>
            <option value="Nominee C">Candidate C</option>
        </select>

        <button onclick="submitVote()">Submit Vote</button>

        <p id="message"></p>
    </div>

    <div class="section">
        <h2>Admin Login</h2>

        <input type="password" id="adminPassword"
        placeholder="Enter Admin Password">

        <button onclick="showResults()">View Results</button>

        <div id="results"></div>
    </div>

</div>

<script>

let votes = JSON.parse(localStorage.getItem("votes")) || {
    "Nominee A": 0,
    "Nominee B": 0,
    "Nominee C": 0
};

function submitVote() {

    let name = document.getElementById("voterName").value;
    let candidate = document.getElementById("candidate").value;

    if (name === "" || nominee === "") {
        document.getElementById("message").innerHTML =
        "Please enter your name and select a candidate.";
        return;
    }

    let voted = JSON.parse(localStorage.getItem("voted")) || [];

    if (voted.includes(name.toLowerCase())) {
        document.getElementById("message").innerHTML =
        "You have already voted!";
        return;
    }

    votes[candidate]++;

    voted.push(name.toLowerCase());

    localStorage.setItem("votes", JSON.stringify(votes));
    localStorage.setItem("voted", JSON.stringify(voted));

    document.getElementById("message").innerHTML =
    "Your vote has been submitted successfully!";

    document.getElementById("voterName").value = "";
    document.getElementById("nominee").value = "";
}

function showResults() {

    let password =
    document.getElementById("adminPassword").value;

    if (password !== "admin123") {
        alert("Incorrect Admin Password!");
        return;
    }

    let total = 0;
    let output = "<h3>Voting Results</h3>";

    for (let candidate in votes) {
        output += candidate + ": " + votes[candidate] +
        " votes<br>";

        total += votes[nominee];
    }

    output += "<br><b>Total Votes: " + total + "</b>";

    document.getElementById("results").innerHTML = output;
}

</script>

</body>
</html>
