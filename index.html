
    
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Voting System</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #edf4ff;
  color: #18345b;
}

header {
  background: linear-gradient(135deg,#0755b5,#1689ed);
  color: white;
  text-align: center;
  padding: 30px 15px;
  box-shadow: 0 7px 18px #174d9160;
}

header h1 {
  font-size: 28px;
  text-shadow: 2px 3px 5px #123d70;
}

header p {
  margin-top: 10px;
}

.container {
  max-width: 850px;
  margin: 25px auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 23px;
  margin-bottom: 22px;
  border-radius: 18px;
  box-shadow: 0 7px 0 #c5dcf7,
              0 12px 25px #254e7a25;
}

h2 {
  color: #0755b5;
  margin-bottom: 18px;
}

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #b8d2f3;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: linear-gradient(135deg,#0862c8,#239cf5);
  color: white;
  border: none;
  border-radius: 11px;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 5px 0 #06458c;
  cursor: pointer;
}

button:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #06458c;
}

.candidate {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px;
  margin: 12px 0;
  border-radius: 12px;
  background: #f0f6ff;
  border: 1px solid #c5dcf7;
}

.candidate input {
  width: auto;
}

.stat {
  background: #e6f2ff;
  padding: 15px;
  border-radius: 12px;
  margin: 10px 0;
  font-weight: bold;
}

footer {
  background: #0755b5;
  color: white;
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>ONLINE VOTING SYSTEM</h1>
  <p>Organization Election Management Portal</p>
</header>

<div class="container">

<div class="card">
  <h2>📊 Election Dashboard</h2>
  <div class="stat">
    Total Candidates: <span id="candidateCount">3</span>
  </div>
  <div class="stat">
    Total Votes: <span id="totalVotes">0</span>
  </div>
  <div class="stat">
    Election Status: <span>Ongoing (Demo)</span>
  </div>
</div>

<div class="card">
  <h2>🗳️ Cast Your Vote</h2>

  <input type="text" id="voter"
  placeholder="Enter your voter ID">

  <h3>Select Your Candidate</h3>

  <label class="candidate">
    <input type="radio" name="candidate" value="Candidate 1">
    Candidate 1
  </label>

  <label class="candidate">
    <input type="radio" name="candidate" value="Candidate 2">
    Candidate 2
  </label>

  <label class="candidate">
    <input type="radio" name="candidate" value="Candidate 3">
    Candidate 3
  </label>
